<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python: Funktioner — Quiz</title>
<style>
  :root{
    --bg: #0f1720;
    --panel: #16212c;
    --panel-2: #1c2b38;
    --text: #e8eef2;
    --text-dim: #93a5b3;
    --accent: #4fd1a5;
    --accent-dim: #2c5c4c;
    --wrong: #e0645a;
    --code-bg: #0b1319;
    --border: #263644;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, #16303020 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 80px;
  }
  .wrap{ width:100%; max-width:640px; }
  header{ margin-bottom:28px; }
  .eyebrow{
    font-family:'Consolas','Courier New',monospace;
    color:var(--accent);
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  h1{ font-size:28px; margin:6px 0 4px; font-weight:700; }
  .subtitle{ color:var(--text-dim); font-size:15px; }
  .progress-track{
    height:6px; background:var(--panel-2); border-radius:99px;
    margin:20px 0 8px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background:var(--accent); border-radius:99px;
    transition:width 0.3s ease; width:0%;
  }
  .progress-label{
    font-size:13px; color:var(--text-dim);
    font-family:'Consolas','Courier New',monospace;
  }
  .card{
    background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:28px;
  }
  .q-prompt{ font-size:19px; line-height:1.5; margin:0 0 20px; font-weight:600; white-space:pre-wrap; }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .option{
    text-align:left; background:var(--panel-2); border:1px solid var(--border);
    color:var(--text); padding:14px 16px; border-radius:10px; font-size:15px;
    cursor:pointer; transition:border-color 0.15s, background 0.15s, transform 0.1s;
    font-family:inherit; white-space:pre-wrap;
  }
  .option:hover:not(:disabled){ border-color:var(--accent); background:#1f313f; }
  .option:active:not(:disabled){ transform:scale(0.99); }
  .option:disabled{ cursor:default; }
  .option.correct{ border-color:var(--accent); background:var(--accent-dim); }
  .option.wrong{ border-color:var(--wrong); background:#3a2426; }
  .feedback{
    margin-top:18px; padding:16px; border-radius:10px;
    background:var(--panel-2); border-left:3px solid var(--accent);
    font-size:14.5px; line-height:1.6; color:var(--text-dim); display:none;
  }
  .feedback.show{ display:block; }
  .feedback .verdict{ color:var(--text); font-weight:700; display:block; margin-bottom:4px; }
  .feedback.is-wrong{ border-left-color:var(--wrong); }
  .nav-row{ margin-top:22px; display:flex; justify-content:flex-end; }
  button.next{
    background:var(--accent); color:#0b1712; border:none; padding:11px 22px;
    border-radius:8px; font-weight:700; font-size:14.5px; cursor:pointer; display:none;
  }
  button.next.show{ display:inline-block; }
  button.next:hover{ filter:brightness(1.08); }
  .result{ text-align:center; padding:40px 20px; }
  .result .score{
    font-size:56px; font-weight:800; color:var(--accent); margin:0;
    font-family:'Consolas','Courier New',monospace;
  }
  .result .score-label{ color:var(--text-dim); font-size:15px; margin-bottom:24px; }
  .result-msg{ font-size:16px; margin-bottom:28px; }
  button.restart{
    background:transparent; border:1px solid var(--border); color:var(--text);
    padding:11px 22px; border-radius:8px; cursor:pointer; font-size:14.5px;
  }
  button.restart:hover{ border-color:var(--accent); color:var(--accent); }
  footer{ text-align:center; color:var(--text-dim); font-size:12.5px; margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Pythonprogrammering</div>
    <h1>Funktioner</h1>
    <div class="subtitle">Skapa egna funktioner — 10 frågor</div>
  </header>

  <div id="quiz-area">
    <div class="progress-label" id="progress-label">Fråga 1 av 10</div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="card" id="card"></div>
  </div>

  <footer>Programmering 1 - Python - Quiz - Funktioner</footer>
</div>

<script>
const questions = [
  {
    prompt: "Vilket nyckelord används för att skapa (definiera) en egen funktion i Python?",
    options: ["function", "def", "func", "create"],
    correct: 1,
    explanation: "En funktion skapas med nyckelordet def (som står för define), följt av funktionens namn, parenteser och ett kolon."
  },
  {
    prompt: 'def hej():\n    print("Hejsan!")\n\nhej()\nhej()\n\nHur många gånger skrivs "Hejsan!" ut?',
    options: ["0 gånger", "1 gång", "2 gånger", "3 gånger"],
    correct: 2,
    explanation: "Raderna med def bara definierar funktionen, ingenting skrivs ut då. Funktionen körs först när man anropar den, och här anropas den två gånger."
  },
  {
    prompt: "def skriv_namn(fornamn, efternamn):\n    print(f\"Förnamn: {fornamn}, Efternamn: {efternamn}\")\n\nVad är viktigt att tänka på när man anropar en funktion med flera värden?",
    options: [
      "Värdena måste skickas i samma ordning som funktionen förväntar sig dem",
      "Värdena måste vara tal",
      "Man kan bara skicka ett värde åt gången",
      "Ordningen spelar ingen roll"
    ],
    correct: 0,
    explanation: "Värdena separeras med kommatecken, och det enda som har betydelse är ordningen. Skriver man skriv_namn(\"Persson\", \"Pelle\") hamnar namnen på fel plats."
  },
  {
    prompt: "def kvadrat(tal):\n    return tal * tal\n\nk = kvadrat(5)\n\nVilket värde har variabeln k?",
    options: ["5", "10", "25", "None"],
    correct: 2,
    explanation: "return skickar tillbaka beräkningen till den som anropade funktionen. kvadrat(5) räknar ut 5 * 5 = 25, och värdet sparas i variabeln k."
  },
  {
    prompt: "Vad händer om en funktion returnerar flera värden, t.ex. return a, b?",
    options: [
      "Bara det första värdet skickas tillbaka",
      "Det ger ett felmeddelande",
      "Värdena skickas tillbaka som en tupel",
      "Värdena skickas tillbaka som en lista"
    ],
    correct: 2,
    explanation: "Det går att returnera flera värden om man separerar dem med kommatecken. De skickas då tillbaka som en tupel."
  },
  {
    prompt: "def berakna_area():\n    bredd = 5\n    hojd = 10\n    area = bredd * hojd\n\nberakna_area()\nprint(area)\n\nVad händer när koden körs?",
    options: [
      "Programmet skriver ut 50",
      "Programmet skriver ut 0",
      "Programmet ger ett NameError, eftersom area är en lokal variabel som inte finns utanför funktionen",
      "Programmet skriver ut None"
    ],
    correct: 2,
    explanation: "En lokal variabel skapas inuti en funktion och existerar bara medan funktionen körs. Utanför funktionen finns area inte, så print(area) ger ett NameError."
  },
  {
    prompt: "poang = 0\n\ndef oka_poang():\n    poang += 1\n\noka_poang()\n\nVarför ger detta ett fel (UnboundLocalError)?",
    options: [
      "Man får aldrig använda variabelnamnet poang",
      "Python ser tilldelningen och tror att poang är en lokal variabel som ännu inte har något värde",
      "Funktioner kan inte ändra tal",
      "Funktionen saknar return"
    ],
    correct: 1,
    explanation: "Tilldelar man ett värde till en variabel inuti en funktion skapar Python en ny lokal variabel med samma namn. Eftersom den lokala poang inte har fått något värde ännu blir det ett fel."
  },
  {
    prompt: "Varför anses det nästan alltid vara dålig praxis att använda nyckelordet global?",
    options: [
      "Det är långsammare än vanliga variabler",
      "Det fungerar bara i Python 2",
      "Det skapar dolda beroenden och gör koden svårare att felsöka och återanvända",
      "Det går inte att läsa globala variabler i funktioner"
    ],
    correct: 2,
    explanation: "Med global blir det svårt att förstå vad en funktion behöver eller påverkar, svårt att felsöka när ett värde blir fel, och svårt att återanvända funktionen i andra projekt. Bättre är att skicka in data via parametrar och returnera resultat med return."
  },
  {
    prompt: "Hur skrivs namnet på en konstant (ett värde som aldrig ändras) i Python, och varför?",
    options: [
      "Med STORA_BOKSTÄVER, för att tydligt visa andra att värdet inte ska ändras",
      "Med små bokstäver och understreck, precis som alla andra variabler",
      "Med ett $ framför namnet",
      "Konstanter finns inte i Python"
    ],
    correct: 0,
    explanation: "I Python skrivs konstanter med STORA_BOKSTÄVER för att tydligt visa att värdet inte ska ändras. Globala variabler är helt okej om de är konstanter."
  },
  {
    prompt: "sum = 60\ntallista = [1, 2, 3]\ntotalt = sum(tallista)\n\nVarför kraschar koden?",
    options: [
      "Listor går inte att summera i Python",
      "Variabeln sum skuggar Pythons inbyggda funktion sum(), så sum är nu ett tal och inte en funktion",
      "tallista saknar citattecken",
      "sum är ett reserverat nyckelord som inte går att använda"
    ],
    correct: 1,
    explanation: "Döper man en variabel till samma namn som en inbyggd funktion (name shadowing) döljs den ursprungliga funktionen. Här är sum ett heltal, så sum(tallista) ger ett TypeError. Välj beskrivande namn som inte krockar med Pythons ord, t.ex. totalsumma."
  }
];

let current = 0;
let score = 0;
let answered = false;

const card = document.getElementById('card');
const progressFill = document.getElementById('progress-fill');
const progressLabel = document.getElementById('progress-label');

function renderQuestion(){
  answered = false;
  const q = questions[current];
  progressLabel.textContent = `Fråga ${current+1} av ${questions.length}`;
  progressFill.style.width = `${(current/questions.length)*100}%`;

  card.innerHTML = `
    <p class="q-prompt" id="prompt"></p>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav-row"><button class="next" id="next-btn">Nästa fråga →</button></div>
  `;
  document.getElementById('prompt').textContent = q.prompt;

  const optionsEl = document.getElementById('options');
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    optionsEl.appendChild(btn);
  });
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  const q = questions[current];
  const optionButtons = document.querySelectorAll('.option');
  optionButtons.forEach((btn, idx) => {
    btn.disabled = true;
    if(idx === q.correct) btn.classList.add('correct');
    if(idx === i && i !== q.correct) btn.classList.add('wrong');
  });

  const feedback = document.getElementById('feedback');
  const isCorrect = i === q.correct;
  if(isCorrect) score++;
  feedback.classList.add('show');
  if(!isCorrect) feedback.classList.add('is-wrong');
  feedback.innerHTML = `<span class="verdict">${isCorrect ? 'Rätt!' : 'Inte riktigt.'}</span>`;
  feedback.appendChild(document.createTextNode(q.explanation));

  const nextBtn = document.getElementById('next-btn');
  nextBtn.classList.add('show');
  nextBtn.textContent = current === questions.length - 1 ? 'Se resultat →' : 'Nästa fråga →';
  nextBtn.onclick = () => {
    current++;
    if(current < questions.length){
      renderQuestion();
    } else {
      renderResult();
    }
  };
}

function renderResult(){
  progressFill.style.width = '100%';
  progressLabel.textContent = 'Klart!';
  const pct = Math.round((score/questions.length)*100);
  let msg;
  if(pct === 100) msg = "Perfekt! Du har full koll på funktioner.";
  else if(pct >= 70) msg = "Bra jobbat! Du har koll på det mesta.";
  else if(pct >= 40) msg = "Godkänt läge — repetera gärna modulen en gång till.";
  else msg = "Dags att gå igenom modulen igen innan nästa steg.";

  card.innerHTML = `
    <div class="result">
      <p class="score">${score}/${questions.length}</p>
      <p class="score-label">${pct}% rätt</p>
      <p class="result-msg">${msg}</p>
      <button class="restart" id="restart-btn">Gör om quizet</button>
    </div>
  `;
  document.getElementById('restart-btn').onclick = () => {
    current = 0;
    score = 0;
    renderQuestion();
  };
}

renderQuestion();
</script>
</body>
</html>
