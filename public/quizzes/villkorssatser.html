<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python: Villkorssatser &amp; Operatorer — Quiz</title>
<style>
  :root{
    --bg: #0f1720;
    --panel: #16212c;
    --panel-2: #1c2b38;
    --text: #e8eef2;
    --text-dim: #93a5b3;
    --accent: #4fd1a5;
    --accent-dim: #2c5c4c;
    --wrong: #e0645a;
    --code-bg: #0b1319;
    --border: #263644;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, #16303020 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 80px;
  }
  .wrap{ width:100%; max-width:640px; }
  header{ margin-bottom:28px; }
  .eyebrow{
    font-family:'Consolas','Courier New',monospace;
    color:var(--accent);
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  h1{ font-size:28px; margin:6px 0 4px; font-weight:700; }
  .subtitle{ color:var(--text-dim); font-size:15px; }
  .progress-track{
    height:6px; background:var(--panel-2); border-radius:99px;
    margin:20px 0 8px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background:var(--accent); border-radius:99px;
    transition:width 0.3s ease; width:0%;
  }
  .progress-label{
    font-size:13px; color:var(--text-dim);
    font-family:'Consolas','Courier New',monospace;
  }
  .card{
    background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:28px;
  }
  .q-prompt{ font-size:19px; line-height:1.5; margin:0 0 20px; font-weight:600; white-space:pre-wrap; }
  .q-prompt code, .options code{
    font-family:'Consolas','Courier New',monospace;
    background:var(--code-bg); padding:2px 6px; border-radius:4px;
    color:#8fd6c4; font-size:0.92em;
  }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .option{
    text-align:left; background:var(--panel-2); border:1px solid var(--border);
    color:var(--text); padding:14px 16px; border-radius:10px; font-size:15px;
    cursor:pointer; transition:border-color 0.15s, background 0.15s, transform 0.1s;
    font-family:inherit;
  }
  .option:hover:not(:disabled){ border-color:var(--accent); background:#1f313f; }
  .option:active:not(:disabled){ transform:scale(0.99); }
  .option:disabled{ cursor:default; }
  .option.correct{ border-color:var(--accent); background:var(--accent-dim); }
  .option.wrong{ border-color:var(--wrong); background:#3a2426; }
  .feedback{
    margin-top:18px; padding:16px; border-radius:10px;
    background:var(--panel-2); border-left:3px solid var(--accent);
    font-size:14.5px; line-height:1.6; color:var(--text-dim); display:none;
  }
  .feedback.show{ display:block; }
  .feedback .verdict{ color:var(--text); font-weight:700; display:block; margin-bottom:4px; }
  .feedback.is-wrong{ border-left-color:var(--wrong); }
  .nav-row{ margin-top:22px; display:flex; justify-content:flex-end; }
  button.next{
    background:var(--accent); color:#0b1712; border:none; padding:11px 22px;
    border-radius:8px; font-weight:700; font-size:14.5px; cursor:pointer; display:none;
  }
  button.next.show{ display:inline-block; }
  button.next:hover{ filter:brightness(1.08); }
  .result{ text-align:center; padding:40px 20px; }
  .result .score{
    font-size:56px; font-weight:800; color:var(--accent); margin:0;
    font-family:'Consolas','Courier New',monospace;
  }
  .result .score-label{ color:var(--text-dim); font-size:15px; margin-bottom:24px; }
  .result-msg{ font-size:16px; margin-bottom:28px; }
  button.restart{
    background:transparent; border:1px solid var(--border); color:var(--text);
    padding:11px 22px; border-radius:8px; cursor:pointer; font-size:14.5px;
  }
  button.restart:hover{ border-color:var(--accent); color:var(--accent); }
  footer{ text-align:center; color:var(--text-dim); font-size:12.5px; margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Pythonprogrammering</div>
    <h1>Villkorssatser &amp; Operatorer</h1>
    <div class="subtitle">Testa vad du kommit ihåg — 10 frågor</div>
  </header>

  <div id="quiz-area">
    <div class="progress-label" id="progress-label">Fråga 1 av 10</div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="card" id="card"></div>
  </div>

  <footer>Skapat med Claude · dela länken fritt med eleverna</footer>
</div>

<script>
const questions = [
  {
    prompt: "Vad kallas satser som if/else, där koden gör olika saker beroende på ett villkor?",
    options: ["Loopar", "Villkorssatser (selektioner)", "Funktioner", "Variabler"],
    correct: 1,
    explanation: "Villkorssatser (även kallade selektioner) exekverar olika kod beroende på om ett eller flera villkor är sanna."
  },
  {
    prompt: "Vad måste alltid stå i slutet av en if-rad i Python?",
    options: ["Ett semikolon ;", "Ett kolon :", "En klammerparentes {", "Inget särskilt tecken"],
    correct: 1,
    explanation: "I Python måste man alltid avsluta if-raden med ett kolon :, och koden som ska köras måste vara indenterad under den."
  },
  {
    prompt: "Hur avgränsar Python vilken kod som tillhör ett if-block, till skillnad från språk som C# och JavaScript?",
    options: ["Med klammerparenteser { }", "Med indrag (indentering)", "Med kolon på varje rad", "Python har inga block"],
    correct: 1,
    explanation: "Många andra språk använder klammerparenteser { }, men i Python används indrag (indentering) — alla rader med samma indrag under if-satsen tillhör samma block."
  },
  {
    prompt: "Vad används else-grenen till i en if-else-sats?",
    options: [
      "Att köra kod om villkoret är sant",
      "Att köra kod om villkoret är falskt",
      "Att avsluta programmet",
      "Att deklarera en ny variabel"
    ],
    correct: 1,
    explanation: "if-else låter dig göra en sak om villkoret är uppfyllt och en annan sak om villkoret inte är uppfyllt."
  },
  {
    prompt: "Vad står elif för och när används det?",
    options: [
      "\"else if\" — för att kolla nästa villkor om det första inte var uppfyllt",
      "\"end if\" — för att avsluta en if-sats",
      "\"else infinite\" — för en oändlig loop",
      "Det är bara ett alias för else"
    ],
    correct: 0,
    explanation: "elif står för \"else if\" och används för att kolla nästa villkor bara om det föregående villkoret var falskt. Man kan ha flera elif efter varandra."
  },
  {
    prompt: "Vad gör den tilldelande operatorn += i Python, t.ex. i uttrycket tal1 += tal2?",
    options: [
      "Jämför om tal1 är lika med tal2",
      "Ett kortare skrivsätt för tal1 = tal1 + tal2",
      "Skapar en ny variabel som heter tal1tal2",
      "Fungerar bara med text, inte med tal"
    ],
    correct: 1,
    explanation: "Tilldelande operatorer som += är ett kortare skrivsätt (\"plussa och tilldela\"). tal1 += tal2 gör samma sak som tal1 = tal1 + tal2. Samma mönster finns för -=, *= och /=."
  },
  {
    prompt: "Vilket nyckelord används i det fallet där ingen av case-grenarna i en match-sats stämmer (default-fallet)?",
    options: ["else", "default", "_", "other"],
    correct: 2,
    explanation: "I match-case används understreck _ för att fånga övriga fall (default), och den måste alltid ligga sist bland case eftersom den alltid är sann."
  },
  {
    prompt: 'Vad gör tecknet | i en match-case-sats, t.ex. "case 6 | 7:"?',
    options: [
      "Delar upp koden i två separata block",
      "Fungerar som en \"eller\"-operator mellan flera värden i samma case",
      "Betyder att villkoret aldrig kan bli sant",
      "Kommenterar bort resten av raden"
    ],
    correct: 1,
    explanation: 'Pipe-tecknet | låter dig kombinera flera värden i samma case, t.ex. "case 6 | 7:" träffar både 6 och 7.'
  },
  {
    prompt: "Vad returnerar 7 % 3 i Python?",
    options: ["2", "1", "2.33", "21"],
    correct: 1,
    explanation: "% är resten-operatorn (modulus). 7/3 blir 2 med resten 1, så 7 % 3 = 1."
  },
  {
    prompt: "Vad är skillnaden mellan / och // i Python?",
    options: [
      "Ingen skillnad, båda gör samma sak",
      "/ ger \"vanlig\" division med decimaler, // ger heltalsdivision avrundat nedåt",
      "/ är bara till för heltal, // för decimaltal",
      "// används för kommentarer i Python"
    ],
    correct: 1,
    explanation: "/ ger vanlig division som kan resultera i decimaltal, medan // (heltalsdivision) alltid avrundar nedåt till närmaste heltal."
  }
];

let current = 0;
let score = 0;
let answered = false;

const card = document.getElementById('card');
const progressFill = document.getElementById('progress-fill');
const progressLabel = document.getElementById('progress-label');

function renderQuestion(){
  answered = false;
  const q = questions[current];
  progressLabel.textContent = `Fråga ${current+1} av ${questions.length}`;
  progressFill.style.width = `${(current/questions.length)*100}%`;

  card.innerHTML = `
    <p class="q-prompt">${q.prompt}</p>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav-row"><button class="next" id="next-btn">Nästa fråga →</button></div>
  `;

  const optionsEl = document.getElementById('options');
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    optionsEl.appendChild(btn);
  });
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  const q = questions[current];
  const optionButtons = document.querySelectorAll('.option');
  optionButtons.forEach((btn, idx) => {
    btn.disabled = true;
    if(idx === q.correct) btn.classList.add('correct');
    if(idx === i && i !== q.correct) btn.classList.add('wrong');
  });

  const feedback = document.getElementById('feedback');
  const isCorrect = i === q.correct;
  if(isCorrect) score++;
  feedback.classList.add('show');
  if(!isCorrect) feedback.classList.add('is-wrong');
  feedback.innerHTML = `<span class="verdict">${isCorrect ? 'Rätt!' : 'Inte riktigt.'}</span>${q.explanation}`;

  const nextBtn = document.getElementById('next-btn');
  nextBtn.classList.add('show');
  nextBtn.textContent = current === questions.length - 1 ? 'Se resultat →' : 'Nästa fråga →';
  nextBtn.onclick = () => {
    current++;
    if(current < questions.length){
      renderQuestion();
    } else {
      renderResult();
    }
  };
}

function renderResult(){
  progressFill.style.width = '100%';
  progressLabel.textContent = 'Klart!';
  const pct = Math.round((score/questions.length)*100);
  let msg;
  if(pct === 100) msg = "Perfekt! Du kan grunderna utantill.";
  else if(pct >= 70) msg = "Bra jobbat! Du har koll på det mesta.";
  else if(pct >= 40) msg = "Godkänt läge — repetera gärna modulerna en gång till.";
  else msg = "Dags att gå igenom modulerna igen innan nästa steg.";

  card.innerHTML = `
    <div class="result">
      <p class="score">${score}/${questions.length}</p>
      <p class="score-label">${pct}% rätt</p>
      <p class="result-msg">${msg}</p>
      <button class="restart" id="restart-btn">Gör om quizet</button>
    </div>
  `;
  document.getElementById('restart-btn').onclick = () => {
    current = 0;
    score = 0;
    renderQuestion();
  };
}

renderQuestion();
</script>
</body>
</html>
