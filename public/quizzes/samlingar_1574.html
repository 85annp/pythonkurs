<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python: Samlingar — Quiz</title>
<style>
  :root{
    --bg: #0f1720;
    --panel: #16212c;
    --panel-2: #1c2b38;
    --text: #e8eef2;
    --text-dim: #93a5b3;
    --accent: #4fd1a5;
    --accent-dim: #2c5c4c;
    --wrong: #e0645a;
    --code-bg: #0b1319;
    --border: #263644;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, #16303020 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 80px;
  }
  .wrap{ width:100%; max-width:640px; }
  header{ margin-bottom:28px; }
  .eyebrow{
    font-family:'Consolas','Courier New',monospace;
    color:var(--accent);
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  h1{ font-size:28px; margin:6px 0 4px; font-weight:700; }
  .subtitle{ color:var(--text-dim); font-size:15px; }
  .progress-track{
    height:6px; background:var(--panel-2); border-radius:99px;
    margin:20px 0 8px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background:var(--accent); border-radius:99px;
    transition:width 0.3s ease; width:0%;
  }
  .progress-label{
    font-size:13px; color:var(--text-dim);
    font-family:'Consolas','Courier New',monospace;
  }
  .card{
    background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:28px;
  }
  .q-prompt{ font-size:19px; line-height:1.5; margin:0 0 20px; font-weight:600; white-space:pre-wrap; }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .option{
    text-align:left; background:var(--panel-2); border:1px solid var(--border);
    color:var(--text); padding:14px 16px; border-radius:10px; font-size:15px;
    cursor:pointer; transition:border-color 0.15s, background 0.15s, transform 0.1s;
    font-family:inherit;
  }
  .option:hover:not(:disabled){ border-color:var(--accent); background:#1f313f; }
  .option:active:not(:disabled){ transform:scale(0.99); }
  .option:disabled{ cursor:default; }
  .option.correct{ border-color:var(--accent); background:var(--accent-dim); }
  .option.wrong{ border-color:var(--wrong); background:#3a2426; }
  .feedback{
    margin-top:18px; padding:16px; border-radius:10px;
    background:var(--panel-2); border-left:3px solid var(--accent);
    font-size:14.5px; line-height:1.6; color:var(--text-dim); display:none;
  }
  .feedback.show{ display:block; }
  .feedback .verdict{ color:var(--text); font-weight:700; display:block; margin-bottom:4px; }
  .feedback.is-wrong{ border-left-color:var(--wrong); }
  .nav-row{ margin-top:22px; display:flex; justify-content:flex-end; }
  button.next{
    background:var(--accent); color:#0b1712; border:none; padding:11px 22px;
    border-radius:8px; font-weight:700; font-size:14.5px; cursor:pointer; display:none;
  }
  button.next.show{ display:inline-block; }
  button.next:hover{ filter:brightness(1.08); }
  .result{ text-align:center; padding:40px 20px; }
  .result .score{
    font-size:56px; font-weight:800; color:var(--accent); margin:0;
    font-family:'Consolas','Courier New',monospace;
  }
  .result .score-label{ color:var(--text-dim); font-size:15px; margin-bottom:24px; }
  .result-msg{ font-size:16px; margin-bottom:28px; }
  button.restart{
    background:transparent; border:1px solid var(--border); color:var(--text);
    padding:11px 22px; border-radius:8px; cursor:pointer; font-size:14.5px;
  }
  button.restart:hover{ border-color:var(--accent); color:var(--accent); }
  footer{ text-align:center; color:var(--text-dim); font-size:12.5px; margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Pythonprogrammering</div>
    <h1>Samlingar</h1>
    <div class="subtitle">Listor, dictionaries och tupler — 10 frågor</div>
  </header>

  <div id="quiz-area">
    <div class="progress-label" id="progress-label">Fråga 1 av 10</div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="card" id="card"></div>
  </div>

  <footer>Programmering 1 - Python - Quiz - Samlingar</footer>
</div>

<script>
const questions = [
  {
    prompt: "Vilket index har det första elementet i en lista i Python?",
    options: ["0", "1", "-1", "Det beror på listans längd"],
    correct: 0,
    explanation: "Indexeringen börjar alltid på 0. Det första elementet har index 0, det andra index 1, och så vidare."
  },
  {
    prompt: 'namn = ["Adam", "Bertil", "Caesar", "David"]\n\nVad skriver print(namn[2]) ut?',
    options: ["Bertil", "Caesar", "David", "Ett felmeddelande"],
    correct: 1,
    explanation: "Adam har index 0, Bertil index 1, Caesar index 2 och David index 3. Alltså skrivs Caesar ut."
  },
  {
    prompt: "En lista har fyra element. Vilket är det sista giltiga indexet, och vilken funktion använder man för att ta reda på hur många element listan har?",
    options: ["3 och len()", "4 och len()", "3 och count()", "4 och size()"],
    correct: 0,
    explanation: "Det sista indexet är alltid len(lista) - 1, eftersom indexeringen börjar på 0. Med fyra element blir det sista indexet 3. len() står för length och ger antalet element."
  },
  {
    prompt: "Vad gör metoden .append(värde) på en lista?",
    options: [
      "Lägger till värdet först i listan",
      "Lägger till värdet i slutet av listan",
      "Tar bort värdet ur listan",
      "Sorterar listan"
    ],
    correct: 1,
    explanation: ".append(värde) lägger till ett nytt element i slutet av listan. Listan växer med ett element."
  },
  {
    prompt: "Vilket av följande tar bort värdet på en specifik plats (index) i en lista?",
    options: ["lista.append(index)", "lista.remove(index)", "del lista[index]", "lista.sort(index)"],
    correct: 2,
    explanation: "del lista[index] (eller .pop(index)) tar bort värdet på en specifik plats. .remove(värde) tar i stället bort ett specifikt värde, oavsett var i listan det står."
  },
  {
    prompt: "Vilket uttryck skapar en tom dictionary (ordlista)?",
    options: ["[]", "()", "{}", "<>"],
    correct: 2,
    explanation: "En dictionary skapas med krullparenteser { }. Tomma hakparenteser [] ger en tom lista, och vanliga parenteser () används för tupler."
  },
  {
    prompt: 'hojder = {"Mount Everest": 8848, "K2": 8611}\n\nHur får man reda på höjden för K2?',
    options: ['hojder[1]', 'hojder["K2"]', 'hojder.K2', 'hojder(K2)'],
    correct: 1,
    explanation: 'I en dictionary använder man nyckeln som "index". Nyckeln "K2" leder till värdet 8611, så hojder["K2"] ger rätt svar.'
  },
  {
    prompt: "Vad ger .items() när man loopar igenom en dictionary, t.ex. for key, value in hojder.items():",
    options: [
      "Både nyckel och värde för varje element",
      "Bara nycklarna",
      "En sorterad kopia av dictionaryn",
      "Antalet element i dictionaryn"
    ],
    correct: 0,
    explanation: ".items() ger nyckel-värde-par, så man kan hämta både nyckeln (key) och värdet (value) i varje varv av loopen."
  },
  {
    prompt: "Vad är den viktigaste skillnaden mellan en tupel och en lista?",
    options: [
      "Tupler skapas med hakparenteser",
      "Tupler är immutable, så värdena kan inte ändras efter att de skapats",
      "Tupler kan bara innehålla tal",
      "Tupler kan växa och krympa under programmets gång"
    ],
    correct: 1,
    explanation: "Tupler är immutable, vilket betyder att deras värden inte kan ändras efter att de har skapats. De skapas med vanliga parenteser ( ). Listor är däremot dynamiska och kan både ändras, växa och krympa."
  },
  {
    prompt: "I ett program som räknar tecken används raden:\n\nif tecken in antal_forekomster:\n\nVad kontrollerar den?",
    options: [
      "Om tecknet redan finns som nyckel i dictionaryn",
      "Om tecknet är ett tal",
      "Om dictionaryn är tom",
      "Om tecknet står i alfabetisk ordning"
    ],
    correct: 0,
    explanation: "Raden kollar om tecknet redan finns som nyckel i dictionaryn. Om det gör det ökar man räknaren, annars skapar man en ny nyckel med värdet 1."
  }
];

let current = 0;
let score = 0;
let answered = false;

const card = document.getElementById('card');
const progressFill = document.getElementById('progress-fill');
const progressLabel = document.getElementById('progress-label');

function renderQuestion(){
  answered = false;
  const q = questions[current];
  progressLabel.textContent = `Fråga ${current+1} av ${questions.length}`;
  progressFill.style.width = `${(current/questions.length)*100}%`;

  card.innerHTML = `
    <p class="q-prompt" id="prompt"></p>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav-row"><button class="next" id="next-btn">Nästa fråga →</button></div>
  `;
  document.getElementById('prompt').textContent = q.prompt;

  const optionsEl = document.getElementById('options');
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    optionsEl.appendChild(btn);
  });
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  const q = questions[current];
  const optionButtons = document.querySelectorAll('.option');
  optionButtons.forEach((btn, idx) => {
    btn.disabled = true;
    if(idx === q.correct) btn.classList.add('correct');
    if(idx === i && i !== q.correct) btn.classList.add('wrong');
  });

  const feedback = document.getElementById('feedback');
  const isCorrect = i === q.correct;
  if(isCorrect) score++;
  feedback.classList.add('show');
  if(!isCorrect) feedback.classList.add('is-wrong');
  feedback.innerHTML = `<span class="verdict">${isCorrect ? 'Rätt!' : 'Inte riktigt.'}</span>`;
  feedback.appendChild(document.createTextNode(q.explanation));

  const nextBtn = document.getElementById('next-btn');
  nextBtn.classList.add('show');
  nextBtn.textContent = current === questions.length - 1 ? 'Se resultat →' : 'Nästa fråga →';
  nextBtn.onclick = () => {
    current++;
    if(current < questions.length){
      renderQuestion();
    } else {
      renderResult();
    }
  };
}

function renderResult(){
  progressFill.style.width = '100%';
  progressLabel.textContent = 'Klart!';
  const pct = Math.round((score/questions.length)*100);
  let msg;
  if(pct === 100) msg = "Perfekt! Du har full koll på samlingar.";
  else if(pct >= 70) msg = "Bra jobbat! Du har koll på det mesta.";
  else if(pct >= 40) msg = "Godkänt läge — repetera gärna modulen en gång till.";
  else msg = "Dags att gå igenom modulen igen innan nästa steg.";

  card.innerHTML = `
    <div class="result">
      <p class="score">${score}/${questions.length}</p>
      <p class="score-label">${pct}% rätt</p>
      <p class="result-msg">${msg}</p>
      <button class="restart" id="restart-btn">Gör om quizet</button>
    </div>
  `;
  document.getElementById('restart-btn').onclick = () => {
    current = 0;
    score = 0;
    renderQuestion();
  };
}

renderQuestion();
</script>
</body>
</html>
